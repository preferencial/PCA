html, body {

.card, .panel, .modal, .dialog, dialog, .container,

  display: block;
  margin-bottom: 5px;

  font-size: 13px !important;
  line-height: 1.35;
}

.uo-field {
  display: flex;
  flex-direction: column;
}

.uo-feedback-box {
  position: fixed;
  right: 16px;
  bottom: 16px;
  z-index: 2147483647;
  min-width: 220px;
  max-width: min(420px, calc(100vw - 32px));
  padding: 10px 12px;
  border: 1px solid var(--uo-border);
  border-radius: var(--uo-radius-group);

  border-color: #8fc2a6;

<script id="up-oracular-form-feedback">
function _escapeHtml(text) {
  if (text === null || text === undefined) return '';
  return String(text).replace(/[&<>'"']/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

(function () {
  'use strict';
  if (window.UpOracularFeedback) return;

  var timer = null;
  function notify(kind, message) {
    var box = document.getElementById('uo-feedback-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'uo-feedback-box';
      box.className = 'uo-feedback-box';
      box.setAttribute('role', 'status');
      box.setAttribute('aria-live', 'polite');
      document.body.appendChild(box);
    }
    box.dataset.kind = kind === 'err' ? 'err' : 'ok';
    box.textContent = String(message || (kind === 'err' ? 'Nao foi possivel concluir.' : 'Operacao concluida.'));
    box.classList.add('is-visible');
    clearTimeout(timer);
    timer = setTimeout(function () {
      box.classList.remove('is-visible');
    }, 1000);
  }

  function connectLabels(form) {
    form.querySelectorAll('input:not([type="hidden"]), select, textarea').forEach(function (field, index) {
      var id = field.id || ('uo-field-' + index + '-' + Math.random().toString(36).slice(2, 7));
      field.id = id;
      var label = form.querySelector('label[for="' + id + '"]');
      if (!label) {
        var sibling = field.previousElementSibling;
        if (sibling && sibling.tagName === 'LABEL') {
          sibling.htmlFor = id;
          label = sibling;
        }
      }
      if (label && field.parentElement && !field.parentElement.classList.contains('uo-field')) {
        field.parentElement.classList.add('uo-field');
      }
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('form').forEach(connectLabels);
  });

  document.addEventListener('submit', function (event) {
    var form = event.target;
    if (!form || form.tagName !== 'FORM') return;
    form.setAttribute('aria-busy', 'true');
    notify('ok', 'Enviando...');
    window.setTimeout(function () {
      if (form.getAttribute('aria-busy') === 'true') {
        form.removeAttribute('aria-busy');
      }
    }, 10000);
  }, true);

  window.UpOracularFeedback = {
    ok: function (message) { notify('ok', message); },
    err: function (message) { notify('err', message); },
    done: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('ok', message);
    },
    fail: function (form, message) {
      if (form) form.removeAttribute('aria-busy');
      notify('err', message);
    }
  };
}());
</script>

<style>
  /*
    @file   CSS_Global.html
    @description  Design System "Institucional+" — Painel da Direção de Escola Classe.
                  Paleta: Navy institucional #1B3A6B + verde federal #0E7F52.
                  Tipografia: Inter, escala Major Third (×1.25), base 16 px.
    @version 2.0
  */

  @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;1,14..32,400&display=swap');

  /* ─────────────────────────────────────────────
     1. DESIGN TOKENS
  ───────────────────────────────────────────── */
  :root {
    /* Brand palette — 60 / 30 / 10 rule */
    --primary:         #1B3A6B;   /* navy — estrutural 30 % */
    --primary-light:   #264F92;   /* hover interativo */
    --primary-dk:      #112447;   /* pressed / deep */
    --accent:          #0E7F52;   /* verde federal — 10 % */
    --accent-hover:    #0A5E3C;
    --accent-tint:     #E8F5EF;

    /* Status semântico */
    --success:         #15803D;
    --success-tint:    #DCFCE7;
    --warning:         #D97706;
    --warning-tint:    #FEF3C7;
    --danger:          #DC2626;
    --danger-tint:     #FEE2E2;
    --info:            #1D4ED8;
    --info-tint:       #DBEAFE;

    /* Superfícies */
    --bg-main:         #EEF0F6;   /* 60 % — branco frio */
    --bg-card:         #FFFFFF;
    --bg-sidebar:      #0E213E;

    /* Hierarquia de texto */
    --text-main:       #111827;
    --text-muted:      #4B5563;
    --text-light:      #9CA3AF;
    --text-inverse:    #FFFFFF;

    /* Bordas */
    --border:          #D1D9E6;
    --border-dk:       #A9B4C8;

    /* Elevação — tintada com o navy da marca */
    --shadow:     0 1px 3px rgba(17,28,55,.08), 0 1px 2px rgba(17,28,55,.05);
    --shadow-lg:  0 8px 24px rgba(17,28,55,.12), 0 3px 8px rgba(17,28,55,.07);
    --shadow-hover: 0 14px 36px rgba(17,28,55,.18), 0 5px 14px rgba(17,28,55,.10);

    /* Espaçamento (grid de 4 px) */
    --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
    --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

    /* Raios */
    --radius-sm: 5px;
    --radius:    10px;
    --radius-lg: 16px;
    --radius-pill: 100px;

    /* Escala tipográfica — Major Third ×1.25 */
    --text-xs:   0.64rem;   /*  ~10 px */
    --text-sm:   0.8rem;    /*  ~13 px */
    --text-base: 1rem;      /*   16 px */
    --text-lg:   1.25rem;   /*   20 px */
    --text-xl:   1.563rem;  /*   25 px */
    --text-2xl:  1.953rem;  /*  ~31 px */
    --text-3xl:  2.441rem;  /*  ~39 px */
    --text-4xl:  3.052rem;  /*  ~49 px */

    /* Movimento */
    --ease-std:  cubic-bezier(0.4, 0, 0.2, 1);
    --ease-out:  cubic-bezier(0, 0, 0.2, 1);
    --ease-in:   cubic-bezier(0.4, 0, 1, 1);
    --dur-fast:  150ms;
    --dur-std:   220ms;
    --dur-slow:  360ms;
  }

  /* ─────────────────────────────────────────────
     2. RESET & BASE
  ───────────────────────────────────────────── */
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    font-size: var(--text-base);
    color: var(--text-main);
    background-color: var(--bg-main);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ─────────────────────────────────────────────
     3. SCROLLBAR
  ───────────────────────────────────────────── */
  ::-webkit-scrollbar             { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track       { background: transparent; }
  ::-webkit-scrollbar-thumb       { background: var(--border-dk); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-light); }

  /* ─────────────────────────────────────────────
     4. LAYOUT
  ───────────────────────────────────────────── */
  #app-content {
    padding: var(--sp-8);
    min-height: calc(100vh - 64px);
    max-width: 1280px;
    margin: 0 auto;
    transition: opacity var(--dur-std) var(--ease-out);
  }

  @media (max-width: 768px) {
    #app-content { padding: var(--sp-4); }
  }

  /* ─────────────────────────────────────────────
     5. TIPOGRAFIA
  ───────────────────────────────────────────── */
  h1, h2, h3, h4 {
    font-weight: 700;
    color: var(--primary);
    line-height: 1.2;
    letter-spacing: -0.02em;
  }

  h1 { font-size: var(--text-2xl); margin-bottom: var(--sp-4); }
  h2 { font-size: var(--text-xl);  margin-bottom: var(--sp-3); }
  h3 { font-size: var(--text-lg);  margin-bottom: var(--sp-3); }
  h4 { font-size: var(--text-base); margin-bottom: var(--sp-2); }

  p  { color: var(--text-muted); }

  .text-gradient {
    background: linear-gradient(120deg, var(--primary) 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ─────────────────────────────────────────────
     6. CARD
  ───────────────────────────────────────────── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--sp-6);
    box-shadow: var(--shadow);
    margin-bottom: var(--sp-6);
    transition:
      transform  var(--dur-std) var(--ease-out),
      box-shadow var(--dur-std) var(--ease-out);
  }

  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
  }

  /* Stat card — faixa de cor no topo */
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: var(--radius);
    padding: var(--sp-6);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    transition:
      transform  var(--dur-std) var(--ease-out),
      box-shadow var(--dur-std) var(--ease-out);
  }

  .stat-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
  }

  .stat-card--primary { border-top-color: var(--primary); }
  .stat-card--accent  { border-top-color: var(--accent);  }
  .stat-card--warning { border-top-color: var(--warning); }
  .stat-card--success { border-top-color: var(--success); }

  .stat-card__label {
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .stat-card__value {
    font-size: var(--text-3xl);
    font-weight: 800;
    color: var(--primary);
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .stat-card__note {
    font-size: var(--text-xs);
    color: var(--text-light);
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: var(--sp-1);
  }

  /* ─────────────────────────────────────────────
     7. BOTÕES
  ───────────────────────────────────────────── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--sp-2);
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: var(--text-sm);
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    border: none;
    outline: none;
    text-decoration: none;
    user-select: none;
    transition:
      background-color var(--dur-fast) var(--ease-std),
      transform        var(--dur-fast) var(--ease-out),
      box-shadow       var(--dur-fast) var(--ease-out),
      opacity          var(--dur-fast) var(--ease-std);
  }

  .btn:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .btn:active { transform: scale(0.97) !important; }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 6px rgba(27,58,107,.30);
  }
  .btn-primary:hover {
    background: var(--primary-light);
    box-shadow: 0 4px 12px rgba(27,58,107,.38);
    transform: translateY(-1px);
  }

  .btn-accent {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 6px rgba(14,127,82,.30);
  }
  .btn-accent:hover {
    background: var(--accent-hover);
    box-shadow: 0 4px 12px rgba(14,127,82,.36);
    transform: translateY(-1px);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1.5px solid var(--border);
  }
  .btn-ghost:hover {
    background: var(--bg-main);
    color: var(--primary);
    border-color: var(--primary);
    transform: translateY(-1px);
  }

  /* ─────────────────────────────────────────────
     8. BADGES
  ───────────────────────────────────────────── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    font-size: var(--text-xs);
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .badge--success { background: var(--success-tint); color: var(--success); }
  .badge--warning { background: var(--warning-tint); color: var(--warning); }
  .badge--danger  { background: var(--danger-tint);  color: var(--danger);  }
  .badge--info    { background: var(--info-tint);    color: var(--info);    }
  .badge--primary { background: rgba(27,58,107,.10); color: var(--primary); }

  /* ─────────────────────────────────────────────
     9. TABELAS
  ───────────────────────────────────────────── */
  .table-wrapper { overflow-x: auto; }

  table.data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--text-sm);
  }

  table.data-table th {
    background: var(--bg-main);
    color: var(--text-muted);
    font-weight: 700;
    font-size: var(--text-xs);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: var(--sp-3) var(--sp-4);
    border-bottom: 2px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }

  table.data-table td {
    padding: var(--sp-3) var(--sp-4);
    border-bottom: 1px solid var(--border);
    color: var(--text-main);
    vertical-align: middle;
  }

  table.data-table tr:last-child td { border-bottom: none; }
  table.data-table tbody tr:hover   { background: #F5F7FB; }

  /* ─────────────────────────────────────────────
     10. FORMULÁRIOS
  ───────────────────────────────────────────── */
  .form-group {
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    margin-bottom: var(--sp-5);
  }

  .form-label {
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--text-main);
  }

  .form-control {
    width: 100%;
    padding: 10px var(--sp-3);
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: var(--text-base);
    color: var(--text-main);
    outline: none;
    transition:
      border-color var(--dur-fast) var(--ease-std),
      box-shadow   var(--dur-fast) var(--ease-std);
  }

  .form-control::placeholder { color: var(--text-light); }

  .form-control:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(27,58,107,.12);
  }

  /* ─────────────────────────────────────────────
     11. UTILITÁRIOS (retrocompatibilidade)
  ───────────────────────────────────────────── */
  .flex            { display: flex; }
  .flex-col        { flex-direction: column; }
  .items-center    { align-items: center; }
  .justify-between { justify-content: space-between; }
  .gap-2           { gap: 0.5rem; }
  .gap-4           { gap: 1rem; }
  .gap-6           { gap: 1.5rem; }
  .mt-4            { margin-top: 1rem; }
  .mt-6            { margin-top: 1.5rem; }
  .mb-4            { margin-bottom: 1rem; }
  .w-full          { width: 100%; }
  .text-center     { text-align: center; }
  .font-bold       { font-weight: 700; }

  /* ─────────────────────────────────────────────
     12. ANIMAÇÕES
  ───────────────────────────────────────────── */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0);    }
  }

  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0);    }
  }

  @keyframes shimmer {
    0%   { background-position: -600px 0; }
    100% { background-position:  600px 0; }
  }

  .animate-fade {
    animation: fadeIn var(--dur-slow) var(--ease-out) both;
  }

  /* Entrada escalonada para filhos diretos */
  .stagger-children > * {
    animation: fadeSlideUp var(--dur-slow) var(--ease-out) both;
  }
  .stagger-children > *:nth-child(1) { animation-delay:   0ms; }
  .stagger-children > *:nth-child(2) { animation-delay:  70ms; }
  .stagger-children > *:nth-child(3) { animation-delay: 140ms; }
  .stagger-children > *:nth-child(4) { animation-delay: 210ms; }
  .stagger-children > *:nth-child(5) { animation-delay: 280ms; }

  /* Skeleton loader */
  .skeleton {
    background: linear-gradient(90deg, var(--border) 25%, #EEF0F8 50%, var(--border) 75%);
    background-size: 600px 100%;
    animation: shimmer 1.4s infinite linear;
    border-radius: var(--radius-sm);
  }

  /* Status dot */
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }
  .status-dot--success { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.7); }
  .status-dot--warning { background: var(--warning); }
  .status-dot--danger  { background: #f87171; }

  /* ─────────────────────────────────────────────
     13. ACESSIBILIDADE
  ───────────────────────────────────────────── */

  /* Visually hidden — legível por leitores de tela */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Focus visível para navegação por teclado */
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }

  /* Skip-to-content link */
  .skip-link {
    position: absolute;
    top: -100%;
    left: var(--sp-4);
    padding: var(--sp-2) var(--sp-4);
    background: var(--primary);
    color: #fff;
    font-weight: 700;
    border-radius: var(--radius-sm);
    z-index: 9999;
    transition: top var(--dur-fast) var(--ease-out);
  }
  .skip-link:focus { top: var(--sp-4); }

  /* ─────────────────────────────────────────────
     14. PREFERS-REDUCED-MOTION
         Respeita preferência do sistema operacional.
  ───────────────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration:        0.01ms !important;
      animation-iteration-count: 1      !important;
      transition-duration:       0.01ms !important;
      scroll-behavior:           auto   !important;
    }
  }

  /* Mobile-first accessibility baseline for Chrome and Google-style readability. */
  :where(html) {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  :where(body) {
    min-width: 0;
    overflow-x: hidden;
    line-height: 1.5;
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
  }

  :where(p, li, dd, dt, blockquote, figcaption, label, td, th, input, select, textarea, button) {
    line-height: 1.5;
  }

  :where(p, li, dd, dt, blockquote, figcaption) {
    max-width: 72ch;
  }

  :where(button, [role="button"], input, select, textarea, a) {
    touch-action: manipulation;
  }

  :where(button, [role="button"], input:not([type="hidden"]), select, textarea) {
    font: inherit;
    min-height: 44px;
  }

  :where(a, button, [role="button"], input, select, textarea, summary, [tabindex]):focus-visible {
    outline: 3px solid #1a73e8;
    outline-offset: 2px;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85);
  }

  :where(img, video, canvas, svg, iframe) {
    max-width: 100%;
  }

  :where(img, video, canvas, svg) {
    height: auto;
  }

  :where(table) {
    max-width: 100%;
  }

  :where(.table-responsive, .table-wrapper, .data-table, .table-container, .responsive-table) {
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  :where(.container, .content, .main, .page, .page-content, .app-content, main) {
    min-width: 0;
  }

  :where(.row, .cards, .card-grid, .grid, .toolbar, .actions, .button-group, .form-row) {
    min-width: 0;
  }

  @media (max-width: 640px) {
    :where(body) {
      font-size: 16px;
    }

    :where(.container, .content, .page-content, .app-content, main) {
      width: 100%;
      max-width: 100%;
    }

    :where(.row, .cards, .card-grid, .grid, .toolbar, .actions, .button-group, .form-row) {
      flex-wrap: wrap;
    }

    :where(input:not([type="checkbox"]):not([type="radio"]), select, textarea, button) {
      max-width: 100%;
    }

    :where(.hide-on-mobile) {
      display: none !important;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: 0.01ms !important;
    }
  }

<script>
/* codex-school-community-ux-script: pequenos ajustes de contexto escolar */
(function() {
  if (window.__codexSchoolCommunityUx) return;
  window.__codexSchoolCommunityUx = true;

  function ready(fn) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn, { once: true });
    else fn();
  }

  ready(function() {
    document.documentElement.setAttribute('data-community-context', 'school');

    document.querySelectorAll('form').forEach(function(form) {
      if (!form.getAttribute('aria-label') && !form.getAttribute('aria-labelledby')) {
        form.setAttribute('aria-label', 'Formulario da comunidade escolar');
      }
    });

    document.querySelectorAll('input, select, textarea').forEach(function(field) {
      if (!field.id && field.name) field.id = 'field-' + String(field.name).replace(/[^a-zA-Z0-9_-]/g, '-');
      if (field.required && !field.getAttribute('aria-required')) field.setAttribute('aria-required', 'true');
      if (!field.getAttribute('autocomplete')) {
        var type = (field.getAttribute('type') || '').toLowerCase();
        var name = (field.getAttribute('name') || field.id || '').toLowerCase();
        if (type === 'email' || name.indexOf('email') >= 0) field.setAttribute('autocomplete', 'email');
        else if (name.indexOf('nome') >= 0 || name.indexOf('name') >= 0) field.setAttribute('autocomplete', 'name');
        else if (name.indexOf('senha') >= 0 || name.indexOf('password') >= 0) field.setAttribute('autocomplete', 'current-password');
      }
    });

    document.querySelectorAll('button:not([type])').forEach(function(button) {
      button.setAttribute('type', 'button');
    });
  });
})();
</script>

<script>
/* codex-project-behavior-standardization: microcomportamentos compartilhados */
(function() {
  if (window.__codexProjectBehaviorStandardization) return;
  window.__codexProjectBehaviorStandardization = true;

  var SUBMIT_LOCK_MS = 2500;
  var invalidFocusPending = false;

  function isElement(value) {
    return value && value.nodeType === 1;
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function unlockForm(form, button) {
    if (isElement(form)) {
      delete form.dataset.codexSubmitting;
      if (form.getAttribute('aria-busy') === 'true') form.setAttribute('aria-busy', 'false');
    }

    if (isElement(button) && button.dataset.codexSubmitLocked === 'true') {

      button.removeAttribute('aria-disabled');
    }

  function restoreSubmitLocks(scope) {
    var root = scope && scope.querySelectorAll ? scope : document;

    root.querySelectorAll('form[data-codex-submitting="true"]').forEach(function(form) {
      unlockForm(form);
    });

    root.querySelectorAll('[data-codex-submit-locked="true"]').forEach(function(button) {
      unlockForm(null, button);
    });
  }

  document.addEventListener('submit', function(event) {
    var form = event.target;
    if (!isElement(form) || String(form.tagName).toLowerCase() !== 'form') return;
    if (form.hasAttribute('data-no-submit-lock')) return;

    if (form.dataset.codexSubmitting === 'true') {

    }

    if (typeof form.checkValidity === 'function' && !form.checkValidity()) return;

    form.setAttribute('aria-busy', 'true');

      button.dataset.codexSubmitLocked = 'true';
      button.disabled = true;
      button.setAttribute('aria-disabled', 'true');
    }

    window.setTimeout(function() {
      unlockForm(form, button);
    }, SUBMIT_LOCK_MS);

  document.addEventListener('invalid', function(event) {
    var field = event.target;
    if (!isElement(field) || invalidFocusPending) return;
    invalidFocusPending = true;

    window.setTimeout(function() {

      }

  }, true);

  document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') return;
    var closedSomething = false;

    var dialogs = Array.prototype.slice.call(document.querySelectorAll('dialog[open]'));
    var dialog = dialogs[dialogs.length - 1];
    if (dialog && typeof dialog.close === 'function') {
      dialog.close();
      closedSomething = true;
    }

    if (!closedSomething) {
      var details = Array.prototype.slice.call(document.querySelectorAll('details[open]'));
      var detail = details[details.length - 1];
      if (detail) {
        detail.removeAttribute('open');
        closedSomething = true;
      }
    }

    document.querySelectorAll('[aria-expanded="true"]').forEach(function(toggle) {
      toggle.setAttribute('aria-expanded', 'false');
      closedSomething = true;
    });

    if (closedSomething) event.preventDefault();
  }, true);

  window.addEventListener('pageshow', function() {
    restoreSubmitLocks(document);
  });

  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') restoreSubmitLocks(document);
  });
})();
</script>
